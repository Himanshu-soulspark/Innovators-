<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>College Bus Tracker (Live)</title>

    <!-- Leaflet CSS (Map Styles) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; overflow: hidden; }

        /* Utility Classes */
        .hidden { display: none !important; }
        .full-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; z-index: 10; }
        
        /* Home Screen */
        #screen-home { justify-content: center; align-items: center; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; padding: 20px; text-align: center; }
        .logo-text { font-size: 2.5rem; margin-bottom: 10px; }
        .sub-text { opacity: 0.8; margin-bottom: 40px; }
        .btn-select { width: 100%; max-width: 300px; padding: 18px; margin: 10px 0; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-driver { background: #ffcc00; color: #000; }
        .btn-student { background: #ffffff; color: #333; }

        /* Driver Screen */
        #screen-driver { background: #1a1a1a; color: white; padding: 20px; align-items: center; justify-content: center; }
        .status-card { background: #2d2d2d; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .indicator { width: 15px; height: 15px; background: #555; border-radius: 50%; margin: 0 auto 15px; transition: 0.3s; }
        .indicator.active { background: #00ff00; box-shadow: 0 0 15px #00ff00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .coord-display { font-family: monospace; font-size: 0.8rem; color: #888; margin-top: 15px; background: #000; padding: 10px; border-radius: 8px; }
        .btn-action { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 1rem; }
        .btn-start { background: #00e676; color: #000; }
        .btn-stop { background: #ff3d00; color: #fff; }

        /* Student Screen (Map) */
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Bottom Sheet (Rapido Style) */
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: white; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 25px; box-shadow: 0 -5px 30px rgba(0,0,0,0.15); z-index: 999; transform: translateY(100%); transition: transform 0.3s ease-out; }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .bus-title { font-size: 1.2rem; font-weight: 700; color: #333; }
        .status-badge { background: #e0f2f1; color: #00695c; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-box { background: #f5f5f5; padding: 15px; border-radius: 12px; text-align: center; }
        .info-value { font-size: 1.1rem; font-weight: 700; color: #333; }
        .info-label { font-size: 0.8rem; color: #777; margin-top: 5px; }

        /* Back Button */
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 1000; background: white; width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Map Marker Icon */
        .bus-icon-marker { font-size: 35px; text-align: center; line-height: 1; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }
    </style>
</head>
<body>

    <!-- SCREEN 1: HOME -->
    <div id="screen-home" class="full-screen">
        <div class="logo-text">🚌</div>
        <h2>College Bus Tracker</h2>
        <p class="sub-text">Live Location System</p>
        
        <button class="btn-select btn-driver" id="select-driver">
            <span>👮‍♂️</span> I am the Driver
        </button>
        <button class="btn-select btn-student" id="select-student">
            <span>🎓</span> I am a Student
        </button>
    </div>

    <!-- SCREEN 2: DRIVER -->
    <div id="screen-driver" class="full-screen hidden">
        <button class="back-btn" onclick="location.reload()">&#8592;</button>
        <div class="status-card">
            <div id="status-indicator" class="indicator"></div>
            <h2 id="driver-status">OFFLINE</h2>
            <p style="color: #bbb; font-size: 0.9rem; margin-top: 5px;">Share location for students</p>
            
            <div class="coord-display" id="debug-coords">
                Waiting for GPS...
            </div>

            <button id="btn-start" class="btn-action btn-start">START SHARING</button>
            <button id="btn-stop" class="btn-action btn-stop hidden">STOP SHARING</button>
        </div>
    </div>

    <!-- SCREEN 3: STUDENT -->
    <div id="screen-student" class="full-screen hidden">
        <button class="back-btn" onclick="location.reload()">&#8592;</button>
        <div id="map"></div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet" id="student-sheet">
            <div class="sheet-header">
                <div>
                    <div class="bus-title">College Bus 01</div>
                    <div style="font-size: 0.8rem; color: #888;">Route: Campus Main</div>
                </div>
                <div class="status-badge" id="live-badge">OFFLINE 🔴</div>
            </div>
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-value" id="disp-speed">0 km/h</div>
                    <div class="info-label">Speed</div>
                </div>
                <div class="info-box">
                    <div class="info-value" id="disp-time">--:--</div>
                    <div class="info-label">Last Update</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FIREBASE MODULE & APP LOGIC -->
    <script type="module">
        // 1. Import Firebase Functions (Modular SDK)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. Your Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB2PG5JvDko2UmQDlY9gN5lBgga2vQy-Ws",
            authDomain: "conceptra-c1000.firebaseapp.com",
            databaseURL: "https://conceptra-c1000-default-rtdb.firebaseio.com",
            projectId: "conceptra-c1000",
            storageBucket: "conceptra-c1000.firebasestorage.app",
            messagingSenderId: "298402987968",
            appId: "1:298402987968:web:c0d0d7d6c08cdfa6bc5225",
            measurementId: "G-QRQYEVSJJ6"
        };

        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app); // Analytics init
        const database = getDatabase(app);   // Database init
        const BUS_ID = "bus1";               // Unique ID for the bus

        // --- DOM ELEMENTS & VARIABLES ---
        const homeScreen = document.getElementById('screen-home');
        const driverScreen = document.getElementById('screen-driver');
        const studentScreen = document.getElementById('screen-student');
        
        let watchId = null; // To store GPS watcher ID
        let map = null;     // Leaflet Map instance
        let busMarker = null; // Bus Marker instance

        // --- NAVIGATION HANDLERS ---
        document.getElementById('select-driver').addEventListener('click', () => {
            homeScreen.classList.add('hidden');
            driverScreen.classList.remove('hidden');
        });

        document.getElementById('select-student').addEventListener('click', () => {
            homeScreen.classList.add('hidden');
            studentScreen.classList.remove('hidden');
            initMap(); // Load map when student enters
        });

        // ===========================================
        // 👮‍♂️ DRIVER LOGIC (SEND DATA)
        // ===========================================
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('driver-status');
        const indicator = document.getElementById('status-indicator');
        const debugCoords = document.getElementById('debug-coords');

        btnStart.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            // UI Update
            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            statusText.innerText = "ONLINE & SHARING";
            indicator.classList.add('active');
            debugCoords.innerText = "Initializing GPS...";

            // Start GPS Tracking
            // FIX APPLIED HERE: Increased timeout and age for indoor testing
            const options = { 
                enableHighAccuracy: true, 
                timeout: 60000,    // Increased to 60 seconds to avoid Timeout Error
                maximumAge: 10000  // Accept 10-second old cached location
            };
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0; // m/s to km/h
                    const timestamp = new Date().toLocaleTimeString();

                    // Update Driver Screen UI
                    debugCoords.innerHTML = `Lat: ${lat.toFixed(5)}<br>Lng: ${lng.toFixed(5)}<br>Speed: ${speed} km/h`;

                    // Send to Firebase
                    set(ref(database, 'buses/' + BUS_ID), {
                        lat: lat,
                        lng: lng,
                        speed: speed,
                        lastUpdated: timestamp,
                        active: true
                    }).catch(err => console.error("Firebase Error:", err));
                },
                (error) => {
                    // Detailed Error Handling
                    console.error("GPS Error:", error);
                    if(error.code === 3) {
                        // Timeout error - silent retry or inform user
                         debugCoords.innerText = "Weak Signal. Retrying...";
                    } else {
                        alert("GPS Error: " + error.message);
                        stopSharing(); // Stop if critical error
                    }
                },
                options
            );
        });

        btnStop.addEventListener('click', () => {
            stopSharing();
        });

        function stopSharing() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            // Set active: false in Firebase
            set(ref(database, 'buses/' + BUS_ID + '/active'), false);

            // UI Reset
            btnStart.classList.remove('hidden');
            btnStop.classList.add('hidden');
            statusText.innerText = "OFFLINE";
            indicator.classList.remove('active');
            debugCoords.innerText = "Tracking Stopped.";
        }

        // ===========================================
        // 🎓 STUDENT LOGIC (RECEIVE DATA)
        // ===========================================
        function initMap() {
            // Initialize Map (Default center India, will move to bus)
            map = L.map('map').setView([20.5937, 78.9629], 5);

            // Add OpenStreetMap Tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            // Custom Bus Icon
            const busIcon = L.divIcon({
                className: 'bus-icon-marker',
                html: '🚌',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            // Listen to Firebase Data Changes
            const busRef = ref(database, 'buses/' + BUS_ID);
            
            onValue(busRef, (snapshot) => {
                const data = snapshot.val();
                const sheet = document.getElementById('student-sheet');
                const badge = document.getElementById('live-badge');

                if (data && data.active) {
                    // Update UI Data
                    sheet.classList.add('show');
                    document.getElementById('disp-speed').innerText = Math.round(data.speed) + " km/h";
                    document.getElementById('disp-time').innerText = data.lastUpdated;
                    badge.innerText = "LIVE 🟢";
                    badge.style.background = "#ccffcc";
                    badge.style.color = "#006600";

                    // Update Map Marker
                    if (busMarker) {
                        busMarker.setLatLng([data.lat, data.lng]);
                    } else {
                        busMarker = L.marker([data.lat, data.lng], {icon: busIcon}).addTo(map);
                    }

                    // Smooth Pan to Bus
                    map.flyTo([data.lat, data.lng], 16, { animate: true, duration: 1 });

                } else {
                    // Bus Offline logic
                    badge.innerText = "OFFLINE 🔴";
                    badge.style.background = "#ffebee";
                    badge.style.color = "#c62828";
                    document.getElementById('disp-speed').innerText = "--";
                }
            });
        }
    </script>
</body>
</html>
