<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Smart Eye Strain Detector</title>
    <!-- Tailwind CSS (Using CDN for prototype as requested) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#06b6d4", // Cyan-500
              primaryDark: "#0891b2", // Cyan-600
              secondary: "#ecfeff", // Cyan-50
              accent: "#22d3ee", // Cyan-400
              surface: "#ffffff", // White
              textMain: "#155e75", // Cyan-900
              textSub: "#64748b", // Slate-500
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"]
            },
            animation: {
              'scan': 'scan 2s linear infinite',
            },
            keyframes: {
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              }
            }
          },
        },
      }
    </script>
    <style>
        body {
            overscroll-behavior-y: none;
            font-family: 'Inter', sans-serif;
            background-color: #ecfeff;
            color: #155e75;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.1);
        }
        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        video { transform: scaleX(-1); }
    </style>
</head>
<body class="min-h-[100dvh] flex justify-center bg-gradient-to-br from-cyan-50 via-white to-blue-50">

    <!-- Mobile Container -->
    <div class="w-full max-w-md h-[100dvh] flex flex-col relative overflow-hidden bg-white shadow-2xl sm:border-x sm:border-cyan-100">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5 z-20 bg-white/50 backdrop-blur-sm sticky top-0">
            <button class="p-2 rounded-full hover:bg-cyan-100 transition-colors text-cyan-700">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold tracking-wide text-cyan-900">Eye Guard AI</h1>
            <button class="p-2 rounded-full hover:bg-cyan-100 transition-colors text-cyan-700">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col px-6 gap-6 overflow-y-auto pb-28">
            
            <!-- Camera Viewfinder -->
            <div class="relative w-full aspect-[4/5] rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-slate-100 group">
                <!-- Live Tag -->
                <div class="absolute top-4 left-4 z-10 px-3 py-1 bg-white/80 backdrop-blur-md border border-red-500/20 rounded-full flex items-center gap-2 shadow-sm">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span class="text-xs font-bold text-red-500 uppercase tracking-wider">Live Cam</span>
                </div>

                <!-- Real Camera Feed -->
                <video id="webcam" class="w-full h-full object-cover" autoplay playsinline muted></video>
                
                <!-- Scanning Overlay (Hidden by default) -->
                <div id="scan-overlay" class="absolute inset-0 bg-cyan-500/10 hidden">
                    <div class="absolute w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_15px_rgba(34,211,238,0.8)] animate-scan"></div>
                    <div class="absolute inset-0 border-2 border-cyan-400/30 rounded-3xl"></div>
                </div>

                <!-- Loading/Error UI -->
                <div id="camera-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 z-20 text-center p-6">
                    <div id="spinner" class="w-10 h-10 border-4 border-cyan-200 border-t-cyan-500 rounded-full animate-spin mb-3"></div>
                    <p id="loading-text" class="text-sm text-cyan-700 font-medium">Initializing AI...</p>
                    
                    <!-- Error Box -->
                    <div id="error-box" class="hidden flex-col items-center gap-2 mt-2">
                        <span class="material-symbols-rounded text-red-500 text-3xl">error</span>
                        <p id="error-msg" class="text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 w-full">
                            Unknown Error
                        </p>
                    </div>
                </div>
            </div>

            <!-- Stats Card -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-4">
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-cyan-600 text-sm font-semibold mb-1 uppercase tracking-wider">Real-time Blink Rate</p>
                        <div class="flex items-baseline gap-1">
                            <span id="blink-count" class="text-5xl font-bold text-cyan-900">0</span>
                            <span class="text-sm text-cyan-600 font-medium">blinks / min</span>
                        </div>
                    </div>
                    <!-- Eye Icon Visualizer -->
                    <div class="relative w-14 h-14 bg-cyan-50 rounded-full flex items-center justify-center border border-cyan-100 shadow-inner">
                         <span id="eye-icon" class="material-symbols-rounded text-4xl text-cyan-500 transition-all duration-100">visibility</span>
                    </div>
                </div>

                <!-- Strain Meter -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-bold uppercase tracking-wider text-cyan-700">
                        <span>Eye Strain Level</span>
                        <span id="status-text" class="text-green-500">Detecting...</span>
                    </div>
                    <!-- Custom Segmented Control -->
                    <div class="h-3 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                        <div id="bar-low" class="h-full bg-green-400 w-1/3 transition-all duration-500 opacity-20"></div>
                        <div id="bar-med" class="h-full bg-yellow-400 w-1/3 transition-all duration-500 opacity-20"></div>
                        <div id="bar-high" class="h-full bg-red-400 w-1/3 transition-all duration-500 opacity-20"></div>
                    </div>
                </div>
                
                <p class="text-xs text-slate-400 text-center mt-1">Make sure you are in a well-lit room.</p>
            </div>

        </main>

        <!-- Bottom Action Bar (Fixed) -->
        <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-white via-white/95 to-transparent z-30">
            <div class="flex gap-4">
                <button onclick="window.toggleScan()" id="scan-btn" class="flex-1 h-14 bg-cyan-500 hover:bg-cyan-600 text-white rounded-xl font-bold text-lg shadow-[0_8px_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 flex items-center justify-center gap-2 group">
                    <span class="material-symbols-rounded group-hover:animate-pulse" id="btn-icon">play_circle</span>
                    <span id="btn-text">Start Tracking</span>
                </button>
                
                <button class="h-14 w-14 glass-panel bg-white rounded-xl flex items-center justify-center text-cyan-600 border-cyan-200 hover:bg-cyan-50 transition-colors active:scale-95 shadow-sm">
                    <span class="material-symbols-rounded">tips_and_updates</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MAIN LOGIC -->
    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const blinkCountElement = document.getElementById("blink-count");
        const eyeIcon = document.getElementById("eye-icon");
        const loadingDiv = document.getElementById("camera-loading");
        const spinner = document.getElementById("spinner");
        const loadingText = document.getElementById("loading-text");
        const errorBox = document.getElementById("error-box");
        const errorMsg = document.getElementById("error-msg");
        
        let faceLandmarker;
        let runningMode = "VIDEO";
        let webcamRunning = false;
        let lastVideoTime = -1;
        let startTime = Date.now();
        let blinkCounter = 0;
        let isEyeClosed = false;
        let isScanning = false;

        // Initialize FaceLandmarker
        async function createFaceLandmarker() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    runningMode: runningMode,
                    numFaces: 1
                });
                
                console.log("AI Model Loaded");
                loadingText.innerText = "Requesting Camera...";
                startCamera();

            } catch (error) {
                showError("Error loading AI Model. Please check internet connection.");
                console.error(error);
            }
        }

        function startCamera() {
            // Check if getUserMedia exists (Safe Check)
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("Browser does not support Camera access. Try using Chrome on HTTPS.");
                return;
            }

            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                loadingDiv.classList.add("hidden");
                webcamRunning = true;
            })
            .catch((err) => {
                console.error("Camera Error:", err);
                // Specific error messages for user understanding
                if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showError("Camera Permission Denied. Please allow access in settings.");
                } else if (err.name === 'NotFoundError') {
                    showError("No Camera Found.");
                } else {
                    showError("Camera Error: Secure Connection (HTTPS) required.");
                }
            });
        }

        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                let results = faceLandmarker.detectForVideo(video, Date.now());

                if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                    detectBlink(results.faceBlendshapes[0].categories);
                }
            }

            if (webcamRunning) {
                window.requestAnimationFrame(predictWebcam);
            }
        }

        function detectBlink(blendshapes) {
            const eyeBlinkLeft = blendshapes.find(s => s.categoryName === 'eyeBlinkLeft');
            const eyeBlinkRight = blendshapes.find(s => s.categoryName === 'eyeBlinkRight');

            if (eyeBlinkLeft && eyeBlinkRight) {
                // > 0.5 means closed
                const isClosedNow = (eyeBlinkLeft.score > 0.5 && eyeBlinkRight.score > 0.5);

                if (isClosedNow) {
                    eyeIcon.innerText = "visibility_off";
                    eyeIcon.classList.replace("text-cyan-500", "text-slate-400");
                    
                    if (!isEyeClosed && isScanning) {
                        isEyeClosed = true;
                        blinkCounter++;
                        updateStats();
                    }
                } else {
                    eyeIcon.innerText = "visibility";
                    eyeIcon.classList.replace("text-slate-400", "text-cyan-500");
                    isEyeClosed = false;
                }
            }
        }

        function updateStats() {
            const now = Date.now();
            const minutesElapsed = (now - startTime) / 60000;
            
            let displayRate = 0;
            if (minutesElapsed < 0.2) {
                displayRate = blinkCounter; 
            } else {
                displayRate = Math.round(blinkCounter / minutesElapsed);
            }
            
            blinkCountElement.innerText = displayRate;
            updateStrainVisuals(displayRate, minutesElapsed);
        }

        function updateStrainVisuals(rate, minutes) {
            const barLow = document.getElementById('bar-low');
            const barMed = document.getElementById('bar-med');
            const barHigh = document.getElementById('bar-high');
            const statusText = document.getElementById('status-text');

            [barLow, barMed, barHigh].forEach(b => b.style.opacity = "0.2");

            if (minutes < 0.2) {
                statusText.innerText = "Calibrating...";
                statusText.className = "text-cyan-500 font-medium";
                return;
            }

            if (rate >= 12) {
                statusText.innerText = "Healthy";
                statusText.className = "text-green-500 font-bold uppercase tracking-wider";
                barLow.style.opacity = "1";
            } else if (rate < 8) {
                statusText.innerText = "High Strain!";
                statusText.className = "text-red-500 font-bold uppercase tracking-wider";
                barLow.style.opacity = "1";
                barMed.style.opacity = "1";
                barHigh.style.opacity = "1";
            } else {
                statusText.innerText = "Moderate";
                statusText.className = "text-yellow-500 font-bold uppercase tracking-wider";
                barLow.style.opacity = "1";
                barMed.style.opacity = "1";
            }
        }

        function showError(msg) {
            spinner.classList.add("hidden");
            loadingText.classList.add("hidden");
            errorBox.classList.remove("hidden");
            errorBox.classList.add("flex");
            errorMsg.innerText = msg;
        }

        // Expose function to global scope
        window.toggleScan = function() {
            isScanning = !isScanning;
            const btn = document.getElementById('scan-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const overlay = document.getElementById('scan-overlay');

            if (isScanning) {
                overlay.classList.remove('hidden');
                btnText.innerText = "Stop Tracking";
                btn.classList.replace('bg-cyan-500', 'bg-red-500');
                btn.classList.replace('hover:bg-cyan-600', 'hover:bg-red-600');
                btnIcon.innerText = "stop_circle";
                
                blinkCounter = 0;
                startTime = Date.now();
                blinkCountElement.innerText = "0";
            } else {
                overlay.classList.add('hidden');
                btnText.innerText = "Start Tracking";
                btn.classList.replace('bg-red-500', 'bg-cyan-500');
                btn.classList.replace('hover:bg-red-600', 'hover:bg-cyan-600');
                btnIcon.innerText = "play_circle";
            }
        };

        // Start
        createFaceLandmarker();
    </script>
</body>
</html>
