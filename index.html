<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAMPUS RIDE (Cyberpunk Edition)</title>

    <!-- Leaflet CSS (Map Styles) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts: Sci-Fi & Tech -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           GLOBAL CYBERPUNK THEME
        ========================================= */
        :root {
            --bg-dark: #020b14;
            --neon-cyan: #00f3ff;
            --neon-blue: #0077ff;
            --neon-alert: #ff003c;
            --glass-bg: rgba(2, 11, 20, 0.7);
            --glass-border: rgba(0, 243, 255, 0.3);
            --text-main: #e0faff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .full-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            background: transparent; 
            z-index: 10; 
            transition: opacity 0.4s ease;
        }

        /* HOLOGRAPHIC BUTTONS */
        .btn-cyber {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            position: relative;
            overflow: hidden;
        }
        .btn-cyber:hover, .btn-cyber:active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.6); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* =========================================
           1. WELCOME SPLASH SCREEN
        ========================================= */
        #screen-splash {
            justify-content: center; align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #0a1f30 0%, #020b14 80%);
        }
        
        .splash-bus-art {
            font-size: 6rem;
            filter: drop-shadow(0 0 20px var(--neon-cyan));
            animation: float 3s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* =========================================
           2. ROLE SELECTION (Split Screen)
        ========================================= */
        #screen-roles { flex-direction: column; }
        
        .role-half {
            flex: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: all 0.3s;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }
        .role-half:hover { background: rgba(0, 243, 255, 0.05); }
        
        .role-icon { font-size: 3rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        .role-label { font-family: 'Orbitron'; font-size: 1.5rem; color: #fff; letter-spacing: 2px; }

        /* =========================================
           3. BUS SELECTION (Cyber List)
        ========================================= */
        #screen-selection { padding: 20px; }
        
        .header-cyber {
            margin-top: 60px; text-align: center; margin-bottom: 30px;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 10px; display: inline-block; width: 100%;
        }
        .header-cyber h2 { font-family: 'Orbitron'; font-size: 1.4rem; color: var(--neon-cyan); letter-spacing: 1px; }

        .bus-list-container {
            display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto; padding-bottom: 80px;
        }

        .bus-card-tech {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 4px; /* Techy sharp corners */
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }
        .bus-card-tech::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .bus-card-tech:hover {
            transform: scale(1.02);
            background: rgba(0, 243, 255, 0.1);
        }
        
        .bus-info h3 { font-family: 'Orbitron'; font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
        .bus-info p { font-size: 0.9rem; color: #aaa; }
        .live-tag {
            font-size: 0.7rem; color: #00ff00; border: 1px solid #00ff00;
            padding: 2px 6px; border-radius: 2px; text-transform: uppercase;
        }

        /* =========================================
           4. DRIVER GPS (Reactor Core)
        ========================================= */
        #screen-driver { justify-content: center; align-items: center; background: #000; }
        
        .reactor-container {
            position: relative; width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
            margin: 40px 0;
        }
        
        .reactor-btn {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #003333 0%, #000 100%);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron'; font-weight: bold; font-size: 1.1rem;
            cursor: pointer; z-index: 2;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            transition: 0.3s;
        }
        .reactor-btn.active {
            background: var(--neon-cyan); color: #000;
            box-shadow: 0 0 50px var(--neon-cyan);
        }

        .ripple {
            position: absolute; width: 100%; height: 100%;
            border: 1px solid var(--neon-cyan); border-radius: 50%;
            opacity: 0;
        }
        .reactor-btn.active ~ .ripple { animation: rippleAnim 2s infinite; }
        .reactor-btn.active ~ .ripple:nth-child(2) { animation-delay: 0.5s; }
        
        @keyframes rippleAnim {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .driver-hud {
            text-align: center; width: 80%;
            border: 1px solid var(--glass-border);
            padding: 20px; background: rgba(0,0,0,0.5);
        }
        .hud-text { font-family: 'Courier New', monospace; color: var(--neon-cyan); margin-top: 10px; font-size: 0.8rem; }

        /* =========================================
           5. STUDENT MAP & NAV BAR
        ========================================= */
        #screen-student { background: #000; }
        #map { height: calc(100% - 60px); width: 100%; z-index: 1; filter: contrast(1.2) grayscale(0.2); }

        /* Floating Info Card */
        .glass-panel {
            position: absolute; bottom: 80px; left: 10px; right: 10px;
            background: rgba(2, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            border-radius: 10px;
            display: flex; justify-content: space-between;
            z-index: 999;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transform: translateY(150%); transition: transform 0.4s ease;
        }
        .glass-panel.show { transform: translateY(0); }
        .panel-data div { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .panel-data span { font-size: 1.2rem; font-family: 'Orbitron'; color: #fff; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #020b14;
            border-top: 1px solid var(--neon-cyan);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #555; font-size: 0.7rem; cursor: pointer;
        }
        .nav-item.active { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        .nav-icon { font-size: 1.2rem; margin-bottom: 3px; }

        /* Custom Markers */
        .marker-pin-bus { font-size: 30px; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
        .marker-pin-user { width: 15px; height: 15px; background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 10px var(--neon-blue); border: 2px solid white; }

    </style>
</head>
<body>

    <!-- SCREEN 1: SPLASH -->
    <div id="screen-splash" class="full-screen">
        <div class="splash-bus-art">🚌</div>
        <div class="app-title">CAMPUS RIDE<br><span style="font-size: 1rem; font-weight: 300; opacity: 0.8;">FUTURE LINK SYSTEM</span></div>
        <button class="btn-cyber" onclick="showScreen('roles')">GET STARTED</button>
    </div>

    <!-- SCREEN 2: ROLE SELECTION -->
    <div id="screen-roles" class="full-screen hidden">
        <div class="role-half" onclick="selectRole('driver')">
            <div class="role-icon">🏎️</div> <!-- Steering Wheel Rep -->
            <div class="role-label">DRIVER</div>
        </div>
        <div class="role-half" style="border-bottom: none;" onclick="selectRole('student')">
            <div class="role-icon">🎓</div>
            <div class="role-label">STUDENT</div>
        </div>
    </div>

    <!-- SCREEN 3: BUS LIST (Shared Design) -->
    <div id="screen-selection" class="full-screen hidden">
        <button class="back-btn" onclick="goBack()">&#8592;</button>
        <div class="header-cyber">
            <h2 id="selection-title">COMMAND CENTER</h2>
        </div>
        <div class="bus-list-container" id="bus-grid-container">
            <!-- JS Injected Cards -->
        </div>
    </div>

    <!-- SCREEN 4: DRIVER DASHBOARD (Reactor) -->
    <div id="screen-driver" class="full-screen hidden">
        <button class="back-btn" onclick="showScreen('selection')">&#8592;</button>
        
        <h2 style="font-family: 'Orbitron'; color: #fff; margin-bottom: 10px;" id="driver-bus-name">TITAN-X</h2>
        <p style="color: var(--neon-cyan);">SYSTEM: STANDBY</p>

        <div class="reactor-container">
            <div class="ripple"></div>
            <div class="ripple"></div>
            <button id="btn-toggle-gps" class="reactor-btn">GO LIVE</button>
        </div>

        <div class="driver-hud">
            <div style="display: flex; justify-content: space-between;">
                <span>GPS SIGNAL</span>
                <span style="color: #00ff00;">STRONG</span>
            </div>
            <div class="hud-text" id="debug-coords">
                WAITING FOR ACTIVATION...
            </div>
        </div>
    </div>

    <!-- SCREEN 5: STUDENT MAP & NAV -->
    <div id="screen-student" class="full-screen hidden">
        <!-- Floating Stats -->
        <div class="glass-panel" id="student-info-panel">
            <div class="panel-data">
                <div>SPEED</div>
                <span id="disp-speed">0 KM/H</span>
            </div>
            <div class="panel-data" style="text-align: right;">
                <div>LAST UPDATE</div>
                <span id="disp-time">--:--</span>
            </div>
        </div>

        <!-- Dark Map -->
        <div id="map"></div>

        <!-- 5-Icon Nav Bar -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="showScreen('selection')">
                <span class="nav-icon">🏠</span> HOME
            </div>
            <div class="nav-item active">
                <span class="nav-icon">🗺️</span> MAP
            </div>
            <div class="nav-item">
                <span class="nav-icon">📍</span> ROUTE
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span> PROFILE
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚠️</span> ALERTS
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyB2PG5JvDko2UmQDlY9gN5lBgga2vQy-Ws",
            authDomain: "conceptra-c1000.firebaseapp.com",
            databaseURL: "https://conceptra-c1000-default-rtdb.firebaseio.com",
            projectId: "conceptra-c1000",
            storageBucket: "conceptra-c1000.firebasestorage.app",
            messagingSenderId: "298402987968",
            appId: "1:298402987968:web:c0d0d7d6c08cdfa6bc5225",
            measurementId: "G-QRQYEVSJJ6"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // --- NEW BUS DATA (Futuristic Names) ---
        const BUS_DATA = [
            { id: 'bus1', name: 'TITAN-X', route: 'Sector 7 Alpha' },
            { id: 'bus2', name: 'THUNDERBOLT', route: 'Skyway Express' },
            { id: 'bus3', name: 'VOYAGER-01', route: 'Central Hub' },
            { id: 'bus4', name: 'FALCON-GT', route: 'West Wing' },
            { id: 'bus5', name: 'OMEGA-PRIME', route: 'Highway Grid' },
            { id: 'bus6', name: 'SOLARIS', route: 'Old City Link' },
            { id: 'bus7', name: 'IRON-CLAD', route: 'Hostel Zone' }
        ];

        // --- STATE ---
        let currentMode = null;
        let selectedBus = null;
        let watchId = null;
        let map = null;
        let busMarker = null;
        let routeLine = null;
        let isDriving = false;

        // --- DOM ELEMENTS ---
        const screens = {
            splash: document.getElementById('screen-splash'),
            roles: document.getElementById('screen-roles'),
            selection: document.getElementById('screen-selection'),
            driver: document.getElementById('screen-driver'),
            student: document.getElementById('screen-student')
        };

        // --- NAVIGATION ---
        window.showScreen = function(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        };

        window.selectRole = function(role) {
            currentMode = role;
            document.getElementById('selection-title').innerText = role === 'driver' ? 'DRIVER CONSOLE' : 'AVAILABLE UNITS';
            renderBusList();
            showScreen('selection');
        };

        window.goBack = function() {
            if(currentMode) showScreen('roles');
            else showScreen('splash');
        };

        // --- RENDER BUS LIST (Futuristic Cards) ---
        function renderBusList() {
            const container = document.getElementById('bus-grid-container');
            container.innerHTML = '';
            
            BUS_DATA.forEach(bus => {
                const card = document.createElement('div');
                card.className = 'bus-card-tech';
                card.innerHTML = `
                    <div class="bus-info">
                        <h3>${bus.name}</h3>
                        <p>${bus.route}</p>
                    </div>
                    ${currentMode === 'student' ? '<span class="live-tag">STATUS: LIVE</span>' : '<span style="color:var(--neon-cyan)">SELECT ></span>'}
                `;
                card.onclick = () => selectBus(bus);
                container.appendChild(card);
            });
        }

        function selectBus(bus) {
            selectedBus = bus;
            if (currentMode === 'driver') {
                initDriverScreen();
            } else {
                initStudentScreen();
            }
        }

        // ===========================================
        // 👮‍♂️ DRIVER LOGIC (Reactor Button)
        // ===========================================
        function initDriverScreen() {
            showScreen('driver');
            document.getElementById('driver-bus-name').innerText = selectedBus.name;
            resetDriverUI();
        }

        const btnToggle = document.getElementById('btn-toggle-gps');
        const debugCoords = document.getElementById('debug-coords');

        function resetDriverUI() {
            isDriving = false;
            if(watchId) navigator.geolocation.clearWatch(watchId);
            btnToggle.classList.remove('active');
            btnToggle.innerText = "GO LIVE";
            debugCoords.innerText = "WAITING FOR ACTIVATION...";
        }

        btnToggle.addEventListener('click', () => {
            if (!isDriving) {
                // START
                if (!navigator.geolocation) return alert("GPS System Failure");
                
                isDriving = true;
                btnToggle.classList.add('active');
                btnToggle.innerText = "STOP";
                debugCoords.innerText = "INITIALIZING UPLINK...";
                debugCoords.style.color = "#00ff00";

                watchId = navigator.geolocation.watchPosition(pos => {
                    const { latitude: lat, longitude: lng, speed } = pos.coords;
                    const spd = speed ? (speed * 3.6).toFixed(1) : 0;
                    const time = new Date().toLocaleTimeString();

                    debugCoords.innerHTML = `LAT: ${lat.toFixed(4)} <br> LNG: ${lng.toFixed(4)} <br> V: ${spd} KM/H`;

                    set(ref(database, 'buses/' + selectedBus.id), {
                        lat, lng, speed: spd, lastUpdated: time, active: true, 
                        name: selectedBus.name, route: selectedBus.route
                    });
                }, err => console.error(err), { enableHighAccuracy: true });

            } else {
                // STOP
                resetDriverUI();
                set(ref(database, 'buses/' + selectedBus.id + '/active'), false);
                debugCoords.innerText = "LINK TERMINATED";
                debugCoords.style.color = "var(--neon-cyan)";
            }
        });

        // ===========================================
        // 🎓 STUDENT LOGIC (Dark Map + Nav)
        // ===========================================
        function initStudentScreen() {
            showScreen('student');
            
            if (map) { map.remove(); map = null; }
            // Dark Mode Map Tiles
            map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            busMarker = null; routeLine = null;

            // Watch Bus Data
            const busRef = ref(database, 'buses/' + selectedBus.id);
            onValue(busRef, (snapshot) => {
                const data = snapshot.val();
                updateMapDisplay(data);
            });
        }

        function updateMapDisplay(data) {
            const panel = document.getElementById('student-info-panel');
            
            if (data && data.active) {
                panel.classList.add('show');
                document.getElementById('disp-speed').innerText = Math.round(data.speed) + " KM/H";
                document.getElementById('disp-time').innerText = data.lastUpdated;

                const busIcon = L.divIcon({ className: 'marker-pin-bus', html: '🚌', iconSize: [40, 40] });

                if (busMarker) busMarker.setLatLng([data.lat, data.lng]);
                else busMarker = L.marker([data.lat, data.lng], { icon: busIcon }).addTo(map);

                map.setView([data.lat, data.lng], 15);
            } else {
                panel.classList.remove('show');
            }
        }

    </script>
</body>
</html>
