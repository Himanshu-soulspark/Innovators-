<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro College Bus Tracker (Red Neon)</title>

    <!-- Leaflet CSS (Map Styles) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* Default background for map screens, overridden in Home */
        body { background-color: #050000; height: 100vh; overflow: hidden; color: #fff; }

        /* Utility Classes */
        .hidden { display: none !important; }
        .full-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; z-index: 10; transition: all 0.3s ease; }

        /* =========================================
           1. NEW ULTRA-PREMIUM HOME SCREEN
           Theme: Deep Red, Black, Neon, Cyberpunk
        ========================================= */
        #screen-home {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 120%, #4a0000 10%, #000000 80%);
            color: white;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Effects (Grid & Particles) */
        #screen-home::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            opacity: 0.3;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }

        /* Content Container (Z-index correction) */
        .home-content { z-index: 5; position: relative; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

        /* 3D Hologram Bus Container */
        .logo-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Rotating Hologram Ring */
        .holo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 0, 60, 0.3);
            border-top: 2px solid #ff003c;
            border-bottom: 2px solid #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4), inset 0 0 10px rgba(255, 0, 60, 0.2);
            animation: spinRing 8s linear infinite;
        }
        .holo-ring::after {
            content: ''; position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%;
            border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 50%;
            animation: spinRing 4s linear infinite reverse;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* The Bus Icon (Styled to look Metallic Blue/Silver via Filters) */
        .logo-text { 
            font-size: 5rem; 
            filter: hue-rotate(190deg) drop-shadow(0 10px 15px rgba(255, 0, 60, 0.6)); /* Turns yellow bus blueish & adds red glow */
            animation: floatBus 3s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        @keyframes floatBus { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Typography */
        .app-title {
            font-family: 'Orbitron', sans-serif; /* Tech Font */
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.8), 0 0 20px rgba(255, 0, 60, 0.4);
            letter-spacing: 1px;
        }
        .sub-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Buttons (High Tech) */
        .btn-select {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border-radius: 50px; /* Pill shape */
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Driver Button - Glowing Red Gradient */
        .btn-driver {
            background: linear-gradient(135deg, #8b0000 0%, #ff003c 100%);
            border: none;
            color: #fff;
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-driver::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
            border-radius: 50px 50px 0 0;
        }
        .btn-driver:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255, 0, 60, 0.5); }

        /* Student Button - Frosted Glass */
        .btn-student {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 60, 0.5);
            color: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-student span { filter: drop-shadow(0 0 5px rgba(255,255,255,0.8)); }
        .btn-student:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }

        /* Bottom Decoration */
        .bottom-glow {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(255, 0, 60, 0.4) 0%, transparent 70%);
            z-index: 2;
            pointer-events: none;
        }

        /* =========================================
           OTHER SCREENS (Preserved but dark-themed)
        ========================================= */
        
        /* 2. Bus Selection Screen */
        #screen-selection { background: #f4f7f6; color: #333; }
        .selection-header { margin-top: 50px; margin-bottom: 20px; text-align: center; }
        .selection-header h2 { color: #333; font-weight: 700; }
        .bus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; overflow-y: auto; padding-bottom: 20px; }
        .bus-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .bus-card:hover { border-color: #004e92; transform: translateY(-2px); }
        .bus-card h3 { font-size: 1rem; color: #333; margin: 10px 0 5px; }
        .bus-card p { font-size: 0.8rem; color: #777; }
        .bus-icon-lg { font-size: 2rem; }

        /* 3. Driver Screen */
        #screen-driver { background: #111; color: white; padding: 20px; align-items: center; justify-content: center; }
        .driver-header { position: absolute; top: 70px; text-align: center; width: 100%; }
        .selected-bus-name { color: #ffcc00; font-size: 1.5rem; font-weight: 700; }
        .status-card { background: #222; padding: 40px 30px; border-radius: 25px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid #333; }
        .indicator { width: 20px; height: 20px; background: #555; border-radius: 50%; margin: 0 auto 20px; transition: 0.3s; }
        .indicator.active { background: #00ff00; box-shadow: 0 0 25px #00ff00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        .coord-display { font-family: 'Courier New', monospace; font-size: 0.85rem; color: #00e676; margin-top: 20px; background: #000; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: left; }
        .btn-action { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 700; margin-top: 25px; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .btn-start { background: linear-gradient(45deg, #00b09b, #96c93d); color: white; box-shadow: 0 5px 20px rgba(0, 176, 155, 0.4); }
        .btn-stop { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; box-shadow: 0 5px 20px rgba(255, 65, 108, 0.4); }

        /* 4. Student Screen (Map) */
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Distance Badge on Map */
        .distance-badge { position: absolute; top: 80px; right: 20px; background: white; padding: 10px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; display: flex; align-items: center; gap: 8px; font-weight: 600; color: #333; }
        .dist-icon { color: #004e92; }

        /* Bottom Sheet */
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: white; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 30px 25px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 999; transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .bus-title { font-size: 1.4rem; font-weight: 800; color: #222; }
        .bus-route-name { font-size: 0.9rem; color: #666; font-weight: 500; }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
        .info-value { font-size: 1.2rem; font-weight: 700; color: #333; }
        .info-label { font-size: 0.75rem; color: #888; margin-top: 5px; text-transform: uppercase; }

        /* Back Button */
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 1000; background: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; color: #333; }
        .back-btn:hover { background: #eee; }

        /* Map Markers */
        .bus-icon-marker { font-size: 40px; text-align: center; line-height: 1; filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.3)); }
        .user-icon-marker { width: 20px; height: 20px; background: #2196f3; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 0 10px rgba(33, 150, 243, 0.2); }
    </style>
</head>
<body>

    <!-- SCREEN 1: HOME (REDESIGNED) -->
    <div id="screen-home" class="full-screen">
        <div class="home-content">
            <!-- 3D Hologram Bus Icon -->
            <div class="logo-container">
                <div class="holo-ring"></div>
                <div class="logo-text">🚌</div>
            </div>

            <!-- Title Section -->
            <div class="app-title">College Bus<br>Tracker</div>
            <p class="sub-text">Premium Live Location System</p>
            
            <!-- Driver Button (Neon Red) -->
            <button class="btn-select btn-driver" id="select-driver-mode">
                <span style="font-size: 1.4rem;">👮‍♂️</span> 
                <span>I am the Driver</span>
            </button>

            <!-- Student Button (Glassmorphism) -->
            <button class="btn-select btn-student" id="select-student-mode">
                <span style="font-size: 1.4rem;">🎓</span> 
                <span>I am a Student</span>
            </button>

            <!-- Bottom Glow Decor -->
            <div class="bottom-glow"></div>
        </div>
    </div>

    <!-- SCREEN 2: BUS SELECTION -->
    <div id="screen-selection" class="full-screen hidden">
        <button class="back-btn" onclick="goHome()">&#8592;</button>
        <div class="selection-header">
            <h2>Select Your Bus</h2>
            <p style="color: #777;">Choose the bus to track or drive</p>
        </div>
        <div class="bus-grid" id="bus-grid-container">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <!-- SCREEN 3: DRIVER DASHBOARD -->
    <div id="screen-driver" class="full-screen hidden">
        <button class="back-btn" onclick="goSelection()">&#8592;</button>
        
        <div class="driver-header">
            <p style="color: #888; font-size: 0.9rem;">You are driving</p>
            <div id="driver-bus-name" class="selected-bus-name">BUS NAME</div>
        </div>

        <div class="status-card">
            <div id="status-indicator" class="indicator"></div>
            <h2 id="driver-status">OFFLINE</h2>
            <p style="color: #888; font-size: 0.9rem; margin-top: 5px;">GPS Tracking System</p>
            
            <div class="coord-display" id="debug-coords">
                Waiting for GPS initialization...
            </div>

            <button id="btn-start" class="btn-action btn-start">START SHARING</button>
            <button id="btn-stop" class="btn-action btn-stop hidden">STOP SHARING</button>
        </div>
    </div>

    <!-- SCREEN 4: STUDENT MAP -->
    <div id="screen-student" class="full-screen hidden">
        <button class="back-btn" onclick="goSelection()">&#8592;</button>
        
        <!-- Distance Float -->
        <div class="distance-badge hidden" id="distance-badge">
            <span class="dist-icon">📏</span>
            <span id="dist-val">0 km</span> away
        </div>

        <div id="map"></div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet" id="student-sheet">
            <div class="sheet-header">
                <div>
                    <div class="bus-title" id="sheet-bus-name">Bus Name</div>
                    <div class="bus-route-name" id="sheet-bus-route">Route Info</div>
                </div>
                <div class="status-badge" id="live-badge">OFFLINE 🔴</div>
            </div>
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-value" id="disp-speed">0 km/h</div>
                    <div class="info-label">Current Speed</div>
                </div>
                <div class="info-box">
                    <div class="info-value" id="disp-time">--:--</div>
                    <div class="info-label">Last Update</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FIREBASE MODULE & APP LOGIC -->
    <script type="module">
        // 1. Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB2PG5JvDko2UmQDlY9gN5lBgga2vQy-Ws",
            authDomain: "conceptra-c1000.firebaseapp.com",
            databaseURL: "https://conceptra-c1000-default-rtdb.firebaseio.com",
            projectId: "conceptra-c1000",
            storageBucket: "conceptra-c1000.firebasestorage.app",
            messagingSenderId: "298402987968",
            appId: "1:298402987968:web:c0d0d7d6c08cdfa6bc5225",
            measurementId: "G-QRQYEVSJJ6"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // --- BUS DATA (POWERFUL NAMES) ---
        const BUS_DATA = [
            { id: 'bus1', name: '⚡ THUNDERBOLT', route: 'North Campus Route' },
            { id: 'bus2', name: '🦅 FALCON', route: 'South City Express' },
            { id: 'bus3', name: '🛡️ GUARDIAN', route: 'West End Shuttle' },
            { id: 'bus4', name: '🚀 VOYAGER', route: 'Central Station Line' },
            { id: 'bus5', name: '🌪️ TORNADO', route: 'Highway Express' },
            { id: 'bus6', name: '🦁 TITAN', route: 'Old City Connect' },
            { id: 'bus7', name: '💎 DIAMOND', route: 'Girls Hostel Special' }
        ];

        // --- STATE MANAGEMENT ---
        let currentMode = null; // 'driver' or 'student'
        let selectedBus = null; // Stores the selected bus object
        let watchId = null;     // Driver GPS ID
        let userWatchId = null; // Student GPS ID
        let map = null;         // Leaflet Map
        let busMarker = null;   // Bus Marker
        let userMarker = null;  // Student Marker
        let routeLine = null;   // Line between student and bus

        // --- DOM ELEMENTS ---
        const screens = {
            home: document.getElementById('screen-home'),
            select: document.getElementById('screen-selection'),
            driver: document.getElementById('screen-driver'),
            student: document.getElementById('screen-student')
        };

        // --- NAVIGATION LOGIC ---
        document.getElementById('select-driver-mode').addEventListener('click', () => {
            currentMode = 'driver';
            showScreen('select');
            renderBusGrid();
        });

        document.getElementById('select-student-mode').addEventListener('click', () => {
            currentMode = 'student';
            showScreen('select');
            renderBusGrid();
        });

        // Global functions for HTML onclicks
        window.goHome = function() {
            showScreen('home');
            stopDriverSharing(); // Safety stop
        };

        window.goSelection = function() {
            showScreen('select');
            stopDriverSharing();
            stopStudentTracking();
        };

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        // --- RENDER BUS GRID ---
        function renderBusGrid() {
            const container = document.getElementById('bus-grid-container');
            container.innerHTML = '';
            
            BUS_DATA.forEach(bus => {
                const card = document.createElement('div');
                card.className = 'bus-card';
                card.innerHTML = `
                    <div class="bus-icon-lg">🚌</div>
                    <h3>${bus.name}</h3>
                    <p>${bus.route}</p>
                `;
                card.onclick = () => selectBus(bus);
                container.appendChild(card);
            });
        }

        function selectBus(bus) {
            selectedBus = bus;
            if (currentMode === 'driver') {
                initDriverScreen();
            } else {
                initStudentScreen();
            }
        }

        // ===========================================
        // 👮‍♂️ DRIVER LOGIC
        // ===========================================
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('driver-status');
        const indicator = document.getElementById('status-indicator');
        const debugCoords = document.getElementById('debug-coords');
        const driverBusName = document.getElementById('driver-bus-name');

        function initDriverScreen() {
            showScreen('driver');
            driverBusName.innerText = selectedBus.name;
            // Reset UI
            btnStart.classList.remove('hidden');
            btnStop.classList.add('hidden');
            statusText.innerText = "OFFLINE";
            indicator.classList.remove('active');
            debugCoords.innerText = "Ready to start...";
        }

        btnStart.addEventListener('click', () => {
            if (!navigator.geolocation) return alert("GPS not supported");

            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            statusText.innerText = "ONLINE (SHARING)";
            statusText.style.color = "#00e676";
            indicator.classList.add('active');
            debugCoords.innerText = "Acquiring satellites...";

            const options = { enableHighAccuracy: true, timeout: 60000, maximumAge: 5000 };
            
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude: lat, longitude: lng, speed } = pos.coords;
                    const spd = speed ? (speed * 3.6).toFixed(1) : 0;
                    const time = new Date().toLocaleTimeString();

                    debugCoords.innerHTML = `Lat: ${lat.toFixed(5)} <br> Lng: ${lng.toFixed(5)} <br> Spd: ${spd} km/h`;

                    // Update Firebase
                    set(ref(database, 'buses/' + selectedBus.id), {
                        lat, lng, speed: spd, lastUpdated: time, active: true, name: selectedBus.name, route: selectedBus.route
                    });
                },
                (err) => console.error("GPS Error", err),
                options
            );
        });

        btnStop.addEventListener('click', stopDriverSharing);

        function stopDriverSharing() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (selectedBus) {
                set(ref(database, 'buses/' + selectedBus.id + '/active'), false);
            }
            if (currentMode === 'driver') {
                btnStart.classList.remove('hidden');
                btnStop.classList.add('hidden');
                statusText.innerText = "OFFLINE";
                statusText.style.color = "#fff";
                indicator.classList.remove('active');
                debugCoords.innerText = "Tracking Stopped.";
            }
        }

        // ===========================================
        // 🎓 STUDENT LOGIC
        // ===========================================
        function initStudentScreen() {
            showScreen('student');
            
            // Map Cleanup & Init
            if (map) { map.remove(); map = null; }
            map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            busMarker = null;
            userMarker = null;
            routeLine = null;

            document.getElementById('sheet-bus-name').innerText = selectedBus.name;
            document.getElementById('sheet-bus-route').innerText = selectedBus.route;

            // 1. Watch Student Location
            if (navigator.geolocation) {
                userWatchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    updateStudentLocation(lat, lng);
                }, (err) => console.log("User GPS Error"), { enableHighAccuracy: true });
            }

            // 2. Watch Bus Location (Firebase)
            const busRef = ref(database, 'buses/' + selectedBus.id);
            onValue(busRef, (snapshot) => {
                const data = snapshot.val();
                updateBusOnMap(data);
            });
        }

        function stopStudentTracking() {
            if (userWatchId) navigator.geolocation.clearWatch(userWatchId);
        }

        // Update Student Marker (Blue Dot)
        let studentLat = null, studentLng = null;
        function updateStudentLocation(lat, lng) {
            studentLat = lat;
            studentLng = lng;

            if (!userMarker) {
                const userIcon = L.divIcon({ className: 'user-icon-marker', iconSize: [20, 20] });
                userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                map.setView([lat, lng], 15); // Initial focus on user
            } else {
                userMarker.setLatLng([lat, lng]);
            }
            drawRouteLine();
        }

        // Update Bus Marker & Info Sheet
        let busLat = null, busLng = null;
        function updateBusOnMap(data) {
            const sheet = document.getElementById('student-sheet');
            const badge = document.getElementById('live-badge');
            
            if (data && data.active) {
                busLat = data.lat;
                busLng = data.lng;

                sheet.classList.add('show');
                document.getElementById('disp-speed').innerText = Math.round(data.speed) + " km/h";
                document.getElementById('disp-time').innerText = data.lastUpdated;
                badge.innerText = "LIVE 🟢";
                badge.style.background = "#e0f2f1"; badge.style.color = "#00695c";

                const busIcon = L.divIcon({
                    className: 'bus-icon-marker', html: '🚌', iconSize: [40, 40], iconAnchor: [20, 20]
                });

                if (busMarker) {
                    busMarker.setLatLng([data.lat, data.lng]);
                } else {
                    busMarker = L.marker([data.lat, data.lng], { icon: busIcon }).addTo(map);
                }

                drawRouteLine();
            } else {
                badge.innerText = "OFFLINE 🔴";
                badge.style.background = "#ffebee"; badge.style.color = "#c62828";
                document.getElementById('disp-speed').innerText = "--";
                document.getElementById('distance-badge').classList.add('hidden');
                
                if (busMarker) map.removeLayer(busMarker);
                if (routeLine) map.removeLayer(routeLine);
                busMarker = null; 
                routeLine = null;
                busLat = null;
            }
        }

        // Draw Line & Calc Distance
        function drawRouteLine() {
            if (studentLat && busLat && busMarker && userMarker) {
                const latlngs = [[studentLat, studentLng], [busLat, busLng]];

                // Create or Update Line
                if (routeLine) {
                    routeLine.setLatLngs(latlngs);
                } else {
                    routeLine = L.polyline(latlngs, { color: '#004e92', weight: 4, opacity: 0.7, dashArray: '10, 10' }).addTo(map);
                }

                // Fit bounds to show both
                map.fitBounds(L.latLngBounds(latlngs), { padding: [50, 50] });

                // Calculate Distance
                const distKm = (map.distance([studentLat, studentLng], [busLat, busLng]) / 1000).toFixed(1);
                
                const distBadge = document.getElementById('distance-badge');
                distBadge.classList.remove('hidden');
                document.getElementById('dist-val').innerText = distKm + " km";
            }
        }
    </script>
</body>
</html>
