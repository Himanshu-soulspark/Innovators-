<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Smart Eye Strain Detector Pro</title>
    <!-- Tailwind CSS (Full Build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#06b6d4", // Cyan-500
              primaryDark: "#0891b2", // Cyan-600
              secondary: "#ecfeff", // Cyan-50
              accent: "#22d3ee", // Cyan-400
              surface: "#ffffff", // White
              textMain: "#155e75", // Cyan-900
              textSub: "#64748b", // Slate-500
              success: "#10b981", // Emerald-500
              warning: "#f59e0b", // Amber-500
              danger: "#ef4444", // Red-500
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"]
            },
            animation: {
              'scan': 'scan 2s linear infinite',
              'pulse-slow': 'pulse 3s infinite',
              'pop-in': 'popIn 0.3s ease-out forwards',
            },
            keyframes: {
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              },
              popIn: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              }
            }
          },
        },
      }
    </script>
    <style>
        body {
            overscroll-behavior-y: none;
            font-family: 'Inter', sans-serif;
            background-color: #ecfeff;
            color: #155e75;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.08);
        }
        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        video { transform: scaleX(-1); } /* Mirror effect */
    </style>
</head>
<body class="min-h-[100dvh] flex justify-center bg-gradient-to-br from-cyan-50 via-white to-blue-50">

    <!-- Mobile Container -->
    <div class="w-full max-w-md h-[100dvh] flex flex-col relative overflow-hidden bg-white shadow-2xl sm:border-x sm:border-cyan-100">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5 z-20 bg-white/60 backdrop-blur-md sticky top-0 border-b border-cyan-50">
            <button class="p-2 rounded-full hover:bg-cyan-100 transition-colors text-cyan-700">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold tracking-wide text-cyan-900">Eye Guard Pro</h1>
            <button class="p-2 rounded-full hover:bg-cyan-100 transition-colors text-cyan-700">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col px-6 gap-6 overflow-y-auto pb-32 pt-4">
            
            <!-- Camera Viewfinder -->
            <div class="relative w-full aspect-[4/5] rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-slate-100 group ring-1 ring-cyan-100">
                <!-- Live Tag -->
                <div class="absolute top-4 left-4 z-10 px-3 py-1 bg-white/90 backdrop-blur-md border border-red-500/20 rounded-full flex items-center gap-2 shadow-sm">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span class="text-xs font-bold text-red-500 uppercase tracking-wider">Live</span>
                </div>

                <!-- Real Camera Feed -->
                <video id="webcam" class="w-full h-full object-cover" autoplay playsinline muted></video>
                
                <!-- Scanning Overlay (Visible only when scanning) -->
                <div id="scan-overlay" class="absolute inset-0 bg-cyan-500/5 hidden">
                    <div class="absolute w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_15px_rgba(34,211,238,0.8)] animate-scan"></div>
                    <!-- Corner Brackets -->
                    <div class="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-cyan-500 rounded-tl-lg"></div>
                    <div class="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-cyan-500 rounded-tr-lg"></div>
                    <div class="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-cyan-500 rounded-bl-lg"></div>
                    <div class="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-cyan-500 rounded-br-lg"></div>
                </div>

                <!-- Loading/Error UI -->
                <div id="camera-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 z-20 text-center p-6">
                    <div id="spinner" class="w-10 h-10 border-4 border-cyan-200 border-t-cyan-500 rounded-full animate-spin mb-3"></div>
                    <p id="loading-text" class="text-sm text-cyan-700 font-medium">Initializing Eye Tracker...</p>
                    
                    <!-- Error Box -->
                    <div id="error-box" class="hidden flex-col items-center gap-2 mt-2">
                        <span class="material-symbols-rounded text-red-500 text-3xl">error</span>
                        <p id="error-msg" class="text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 w-full">
                            Unknown Error
                        </p>
                    </div>
                </div>
            </div>

            <!-- Stats Card (Live) -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-4 relative overflow-hidden">
                <div class="flex justify-between items-end relative z-10">
                    <div>
                        <p class="text-cyan-600 text-xs font-bold uppercase tracking-widest mb-1">Session Blinks</p>
                        <div class="flex items-baseline gap-1">
                            <span id="blink-count" class="text-5xl font-bold text-cyan-900 tracking-tight">0</span>
                            <span class="text-sm text-cyan-600 font-medium">total</span>
                        </div>
                    </div>
                    <!-- Eye Icon Visualizer -->
                    <div class="relative w-14 h-14 bg-cyan-50 rounded-full flex items-center justify-center border border-cyan-100 shadow-inner">
                         <span id="eye-icon" class="material-symbols-rounded text-4xl text-cyan-500 transition-all duration-150">visibility</span>
                    </div>
                </div>

                <!-- Timer & Status -->
                <div class="flex flex-col gap-2 relative z-10">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-400 uppercase font-bold">Time Left</span>
                        <span id="timer-display" class="text-lg font-mono font-bold text-cyan-700">01:00</span>
                    </div>
                    
                    <!-- Progress Bar Container -->
                    <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-cyan-500 w-0 transition-all duration-1000 ease-linear rounded-full"></div>
                    </div>
                </div>
            </div>

        </main>

        <!-- RESULT POPUP MODAL (Hidden by default) -->
        <div id="result-modal" class="absolute inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-6">
            <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-pop-in border border-white/50">
                <div class="flex justify-center mb-4">
                    <div class="w-16 h-16 rounded-full bg-cyan-50 flex items-center justify-center border-4 border-white shadow-lg">
                        <span class="material-symbols-rounded text-4xl text-cyan-600">analytics</span>
                    </div>
                </div>
                
                <h2 class="text-2xl font-bold text-center text-slate-800 mb-1">Analysis Complete</h2>
                <p class="text-center text-slate-500 text-sm mb-6">1-Minute Session Report</p>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-50 p-3 rounded-2xl text-center">
                        <p class="text-xs text-slate-400 uppercase font-bold">Blinks / Min</p>
                        <p id="modal-rate" class="text-2xl font-bold text-cyan-700">--</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center">
                        <p class="text-xs text-slate-400 uppercase font-bold">Total Blinks</p>
                        <p id="modal-total" class="text-2xl font-bold text-slate-700">--</p>
                    </div>
                </div>

                <!-- Strain Result Box -->
                <div id="modal-verdict-box" class="rounded-xl p-4 mb-6 flex items-center gap-3 border-l-4">
                    <span id="modal-icon" class="material-symbols-rounded text-3xl">check_circle</span>
                    <div>
                        <p class="text-xs opacity-80 font-bold uppercase">Strain Level</p>
                        <p id="modal-verdict" class="text-lg font-bold">Calculating...</p>
                    </div>
                </div>

                <button onclick="window.closeModal()" class="w-full py-3.5 bg-slate-900 text-white rounded-xl font-semibold shadow-lg active:scale-95 transition-transform">
                    Start New Test
                </button>
            </div>
        </div>

        <!-- Bottom Action Bar (Fixed) -->
        <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-white via-white/95 to-transparent z-30">
            <div class="flex gap-4">
                <button onclick="window.toggleScan()" id="scan-btn" class="flex-1 h-14 bg-cyan-500 hover:bg-cyan-600 text-white rounded-xl font-bold text-lg shadow-[0_8px_20px_rgba(6,182,212,0.3)] transition-all active:scale-95 flex items-center justify-center gap-2 group">
                    <span class="material-symbols-rounded group-hover:animate-pulse" id="btn-icon">play_circle</span>
                    <span id="btn-text">Start 1-Min Test</span>
                </button>
                
                <button class="h-14 w-14 glass-panel bg-white rounded-xl flex items-center justify-center text-cyan-600 border-cyan-200 hover:bg-cyan-50 transition-colors active:scale-95 shadow-sm">
                    <span class="material-symbols-rounded">tips_and_updates</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MAIN LOGIC -->
    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        // DOM Elements
        const video = document.getElementById("webcam");
        const blinkCountEl = document.getElementById("blink-count");
        const eyeIcon = document.getElementById("eye-icon");
        const timerDisplay = document.getElementById("timer-display");
        const progressBar = document.getElementById("progress-bar");
        
        // Modal Elements
        const modal = document.getElementById("result-modal");
        const modalRate = document.getElementById("modal-rate");
        const modalTotal = document.getElementById("modal-total");
        const modalVerdict = document.getElementById("modal-verdict");
        const modalVerdictBox = document.getElementById("modal-verdict-box");
        const modalIcon = document.getElementById("modal-icon");

        // UI Loading Elements
        const loadingDiv = document.getElementById("camera-loading");
        const spinner = document.getElementById("spinner");
        const loadingText = document.getElementById("loading-text");
        const errorBox = document.getElementById("error-box");
        const errorMsg = document.getElementById("error-msg");
        
        // Logic Variables
        let faceLandmarker;
        let runningMode = "VIDEO";
        let webcamRunning = false;
        let lastVideoTime = -1;
        
        // Session Variables
        let isScanning = false;
        let blinkCounter = 0;
        let isEyeClosed = false;
        let timerInterval = null;
        let remainingTime = 60; // 60 seconds fixed duration

        // --- 1. SETUP AI ---
        async function createFaceLandmarker() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    runningMode: runningMode,
                    numFaces: 1
                });
                
                console.log("AI Model Loaded");
                loadingText.innerText = "Requesting Camera...";
                startCamera();

            } catch (error) {
                showError("Error loading AI. Refresh page.");
                console.error(error);
            }
        }

        // --- 2. CAMERA HANDLING ---
        function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("Browser not supported. Use Chrome (HTTPS).");
                return;
            }

            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                loadingDiv.classList.add("hidden");
                webcamRunning = true;
            })
            .catch((err) => {
                if(err.name === 'NotAllowedError') showError("Permission Denied. Allow Camera.");
                else showError("Camera Error. Use HTTPS.");
            });
        }

        // --- 3. PREDICTION LOOP ---
        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                let results = faceLandmarker.detectForVideo(video, Date.now());

                if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                    detectBlink(results.faceBlendshapes[0].categories);
                }
            }
            if (webcamRunning) window.requestAnimationFrame(predictWebcam);
        }

        // --- 4. BLINK DETECTION LOGIC (SENSITIVE) ---
        function detectBlink(blendshapes) {
            const eyeBlinkLeft = blendshapes.find(s => s.categoryName === 'eyeBlinkLeft');
            const eyeBlinkRight = blendshapes.find(s => s.categoryName === 'eyeBlinkRight');

            if (eyeBlinkLeft && eyeBlinkRight) {
                // SENSITIVITY: 0.4 threshold for sensitive detection
                const avgScore = (eyeBlinkLeft.score + eyeBlinkRight.score) / 2;
                const CLOSE_THRESHOLD = 0.4; 
                const OPEN_THRESHOLD = 0.3;

                if (avgScore > CLOSE_THRESHOLD) {
                    // Visual Update
                    eyeIcon.innerText = "visibility_off";
                    eyeIcon.classList.replace("text-cyan-500", "text-slate-400");
                    
                    // Logic Update (Only if scanning)
                    if (isScanning && !isEyeClosed) {
                        isEyeClosed = true;
                        blinkCounter++;
                        blinkCountEl.innerText = blinkCounter;
                        
                        // Pulse Animation
                        blinkCountEl.classList.remove('scale-100');
                        blinkCountEl.classList.add('scale-110');
                        setTimeout(() => blinkCountEl.classList.remove('scale-110'), 100);
                    }
                } else if (avgScore < OPEN_THRESHOLD) {
                    // Visual Update
                    eyeIcon.innerText = "visibility";
                    eyeIcon.classList.replace("text-slate-400", "text-cyan-500");
                    isEyeClosed = false;
                }
            }
        }

        // --- 5. TIMER & BUTTON LOGIC ---
        window.toggleScan = function() {
            const btn = document.getElementById('scan-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const overlay = document.getElementById('scan-overlay');

            if (!isScanning) {
                // --- START SESSION ---
                isScanning = true;
                blinkCounter = 0;
                blinkCountEl.innerText = "0";
                remainingTime = 60; // Reset to 60 seconds
                
                // UI Changes
                overlay.classList.remove('hidden');
                btnText.innerText = "Stop Scanning";
                btn.classList.replace('bg-cyan-500', 'bg-red-500');
                btn.classList.replace('hover:bg-cyan-600', 'hover:bg-red-600');
                btn.classList.replace('shadow-[0_8px_20px_rgba(6,182,212,0.3)]', 'shadow-[0_8px_20px_rgba(239,68,68,0.3)]');
                btnIcon.innerText = "stop_circle";
                
                // Reset Progress Bar
                progressBar.style.width = "0%";
                progressBar.classList.remove("bg-red-500");
                progressBar.classList.add("bg-cyan-500");
                
                // Update Initial Timer
                timerDisplay.innerText = "01:00";

                // Start Countdown
                timerInterval = setInterval(() => {
                    remainingTime--;
                    updateTimerUI();

                    if (remainingTime <= 0) {
                        // AUTO STOP
                        window.toggleScan(); 
                    }
                }, 1000);

            } else {
                // --- STOP SESSION ---
                isScanning = false;
                clearInterval(timerInterval);
                
                // UI Changes
                overlay.classList.add('hidden');
                btnText.innerText = "Start 1-Min Test";
                btn.classList.replace('bg-red-500', 'bg-cyan-500');
                btn.classList.replace('hover:bg-red-600', 'hover:bg-cyan-600');
                btn.classList.replace('shadow-[0_8px_20px_rgba(239,68,68,0.3)]', 'shadow-[0_8px_20px_rgba(6,182,212,0.3)]');
                btnIcon.innerText = "play_circle";

                // Show Results
                showResultModal();
            }
        };

        function updateTimerUI() {
            const mins = Math.floor(remainingTime / 60).toString().padStart(2, '0');
            const secs = (remainingTime % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
            
            // Progress Bar Logic (Fills up as time reduces)
            const percentage = ((60 - remainingTime) / 60) * 100;
            progressBar.style.width = `${percentage}%`;
            
            // Change color if time is low (last 10 secs)
            if(remainingTime < 10) {
                progressBar.classList.remove("bg-cyan-500");
                progressBar.classList.add("bg-red-500");
                timerDisplay.classList.add("text-red-500");
            } else {
                timerDisplay.classList.remove("text-red-500");
            }
        }

        // --- 6. RESULT CALCULATION ---
        function showResultModal() {
            // Logic based on actual duration passed (in case user stopped early)
            const durationUsed = 60 - remainingTime; 
            const durationMin = durationUsed / 60;
            
            let rate = 0;
            // If less than 5 seconds, data is too small
            if (durationUsed < 5) {
                rate = blinkCounter; // Raw count
            } else {
                // Extrapolate to per minute if stopped early, or just take count if 1 min passed
                rate = Math.round(blinkCounter / (durationMin || 1));
            }

            modalTotal.innerText = blinkCounter;
            modalRate.innerText = rate;
            
            // Verdict Logic
            modalVerdictBox.className = "rounded-xl p-4 mb-6 flex items-center gap-3 border-l-4";

            if (durationUsed < 10) {
                modalVerdict.innerText = "Insufficient Data";
                modalVerdictBox.classList.add("bg-slate-100", "border-slate-400", "text-slate-700");
                modalIcon.innerText = "timer_off";
            } else if (rate >= 12 && rate <= 28) {
                modalVerdict.innerText = "Healthy Blink Rate";
                modalVerdictBox.classList.add("bg-green-50", "border-green-500", "text-green-800");
                modalIcon.innerText = "check_circle";
                modalIcon.className = "material-symbols-rounded text-3xl text-green-600";
            } else if (rate < 12) {
                modalVerdict.innerText = "High Eye Strain";
                modalVerdictBox.classList.add("bg-red-50", "border-red-500", "text-red-800");
                modalIcon.innerText = "warning";
                modalIcon.className = "material-symbols-rounded text-3xl text-red-600";
            } else {
                modalVerdict.innerText = "Fatigue / Anxiety";
                modalVerdictBox.classList.add("bg-yellow-50", "border-yellow-500", "text-yellow-800");
                modalIcon.innerText = "opacity";
                modalIcon.className = "material-symbols-rounded text-3xl text-yellow-600";
            }

            modal.classList.remove("hidden");
        }

        window.closeModal = function() {
            modal.classList.add("hidden");
            // Reset UI
            timerDisplay.innerText = "01:00";
            timerDisplay.classList.remove("text-red-500");
            progressBar.style.width = "0%";
            progressBar.classList.remove("bg-red-500");
            progressBar.classList.add("bg-cyan-500");
        }

        function showError(msg) {
            spinner.classList.add("hidden");
            loadingText.classList.add("hidden");
            errorBox.classList.remove("hidden");
            errorBox.classList.add("flex");
            errorMsg.innerText = msg;
        }

        // Initialize
        createFaceLandmarker();
    </script>
</body>
</html>
